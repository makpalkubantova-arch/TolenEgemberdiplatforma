<!DOCTYPE html>
<html lang="kk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>MathLevel Up · Математика 7</title>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
:root{--bg:#f3f5fb;--card:#fff;--ink:#1c2236;--mut:#626b80;--line:#e2e6ef;--pri:#3a5bdc;--pri2:#e7ecfd;--geo:#e47a2e;--geo2:#fdefe3;--ok:#1d9d62;--ok2:#e3f5ec;--bad:#d64545;--bad2:#fdeaea;--gold:#f2b705;--vio:#7a4fd8}
*{box-sizing:border-box}
body{margin:0;font-family:Nunito,system-ui,sans-serif;background:var(--bg);color:var(--ink);line-height:1.5}
button{font-family:inherit}
header{position:sticky;top:0;z-index:20;background:linear-gradient(110deg,#23307a,#3a5bdc 60%,#7a4fd8);color:#fff;padding:10px 18px;display:flex;align-items:center;gap:14px;flex-wrap:wrap;box-shadow:0 4px 18px rgba(30,40,100,.2)}
.logo{font-weight:900;font-size:19px;letter-spacing:-.01em;cursor:pointer}
.logo small{display:block;font-weight:700;font-size:11px;opacity:.8}
.nav{display:flex;gap:6px;flex-wrap:wrap}
.nav button{background:rgba(255,255,255,.14);border:1px solid rgba(255,255,255,.25);color:#fff;padding:6px 12px;border-radius:999px;font-weight:800;font-size:13px;cursor:pointer}
.nav button.on{background:#fff;color:#23307a}
.me{margin-left:auto;display:flex;align-items:center;gap:10px}
.lvlBadge{width:42px;height:42px;border-radius:50%;background:var(--gold);color:#3b2a00;display:grid;place-items:center;font-weight:900;font-size:18px;box-shadow:0 0 0 3px rgba(255,255,255,.5)}
.xpwrap{min-width:170px}
.xpwrap .nm{font-weight:800;font-size:13px}
.xpbar{height:9px;background:rgba(255,255,255,.25);border-radius:99px;overflow:hidden;margin-top:3px}
.xpbar i{display:block;height:100%;background:linear-gradient(90deg,#ffd54a,#ff9f1c);transition:width .5s}
.xptxt{font-size:11px;opacity:.85}
.wrap{max-width:1150px;margin:0 auto;padding:20px}
.card{background:var(--card);border:1px solid var(--line);border-radius:18px;padding:20px 22px;margin-bottom:16px}
h1{font-size:26px;margin:4px 0 8px;letter-spacing:-.015em}
h2{font-size:21px;margin:0 0 10px}
h3{font-size:17px;margin:0 0 8px}
.mut{color:var(--mut)}
.btn{background:var(--pri);color:#fff;border:none;padding:11px 20px;border-radius:12px;font-weight:800;font-size:15px;cursor:pointer;box-shadow:0 3px 0 #2742b0}
.btn:active{transform:translateY(2px);box-shadow:none}
.btn.ghost{background:#fff;color:var(--ink);border:1.5px solid var(--line);box-shadow:none}
.btn.ok{background:var(--ok);box-shadow:0 3px 0 #147447}
.btn.gold{background:var(--gold);color:#3b2a00;box-shadow:0 3px 0 #b68900}
.btn:disabled{opacity:.5;cursor:default}
input.txt{width:100%;padding:12px 14px;border:1.5px solid var(--line);border-radius:12px;font:700 16px Nunito}
input.txt:focus{outline:none;border-color:var(--pri)}
/* карта */
.section{background:var(--card);border:1px solid var(--line);border-radius:20px;padding:18px 20px;margin-bottom:18px;position:relative;overflow:hidden}
.section .shead{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.snum{width:44px;height:44px;border-radius:14px;display:grid;place-items:center;font-weight:900;color:#fff;font-size:18px;flex:none}
.section.locked{opacity:.55}
.path{display:flex;flex-wrap:wrap;gap:12px}
.node{width:128px;border:2px solid var(--line);border-radius:16px;padding:10px;background:#fff;cursor:pointer;text-align:left;transition:.15s;position:relative}
.node:hover{transform:translateY(-2px);border-color:var(--pri)}
.node .pn{font-weight:900;font-size:13px;color:var(--pri)}
.node .pt{font-weight:700;font-size:12.5px;line-height:1.25;margin-top:3px;min-height:46px}
.node .st{font-size:15px;letter-spacing:1px;margin-top:4px;color:#d4d8e2}
.node .st b{color:var(--gold);font-weight:400}
.node.lock{background:#f5f6f9;cursor:not-allowed}
.node.lock:hover{transform:none;border-color:var(--line)}
.node.lock .pn,.node.lock .pt{color:#a5acbb}
.node.lock::after{content:"🔒";position:absolute;top:8px;right:8px;font-size:14px}
.node.done{border-color:var(--ok);background:var(--ok2)}
.node.cur{border-color:var(--pri);box-shadow:0 0 0 4px var(--pri2)}
.node.boss{width:150px;background:linear-gradient(135deg,#fff6d8,#ffe7a8);border-color:#f2c94c}
.node.boss .pn{color:#9a6b00}
/* сабақ */
.steps{display:flex;gap:6px;flex-wrap:wrap;margin:12px 0 0}
.steps button{border:1.5px solid var(--line);background:#fff;padding:8px 14px;border-radius:12px;font-weight:800;font-size:13.5px;cursor:pointer;color:var(--mut)}
.steps button.on{background:var(--ink);color:#fff;border-color:var(--ink)}
.formula{background:#f6f7fc;border-left:5px solid var(--vio);padding:12px 16px;border-radius:10px;font:700 18px "Cambria Math",Georgia,serif;margin:12px 0}
.example{background:#fffbea;border:1.5px dashed #e8d58a;border-radius:12px;padding:12px 16px;margin:10px 0}
.bridge{background:linear-gradient(90deg,var(--pri2),var(--geo2));border-radius:14px;padding:14px 16px;margin-top:12px}
.bridge b{color:var(--geo)}
.ctrls{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:10px 18px;margin:6px 0 12px}
.ctrls label{font-weight:800;font-size:13px;color:var(--mut);display:flex;flex-direction:column;gap:4px}
.out{font-weight:700;background:#f6f7fc;border-radius:12px;padding:10px 14px;margin-top:10px}
svg.plot{width:100%;max-width:560px;height:auto;background:#fff;border:1px solid var(--line);border-radius:14px;display:block}
/* есеп */
.prob{font:800 22px "Cambria Math",Georgia,serif;margin:6px 0 14px;line-height:1.45}
.choices{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.choice{border:2px solid var(--line);background:#fff;border-radius:14px;padding:12px 14px;font:700 17px "Cambria Math",Georgia,serif;cursor:pointer;text-align:left}
.choice:hover{border-color:var(--pri)}
.choice.sel{border-color:var(--pri);background:var(--pri2)}
.choice.right{border-color:var(--ok);background:var(--ok2)}
.choice.wrong{border-color:var(--bad);background:var(--bad2)}
.fb{margin-top:12px;padding:12px 14px;border-radius:12px;font-weight:700;display:none}
.fb.ok{display:block;background:var(--ok2);color:#126b42}
.fb.no{display:block;background:var(--bad2);color:#9b2c2c}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;gap:6px;background:#f1f3f9;border-radius:999px;padding:5px 12px;font-weight:800;font-size:13px}
.dots{display:flex;gap:6px;margin:4px 0 12px}
.dots i{width:30px;height:8px;border-radius:9px;background:#e3e7f0}
.dots i.ok{background:var(--ok)} .dots i.no{background:var(--bad)} .dots i.cur{background:var(--pri)}
table.t{width:100%;border-collapse:collapse;font-size:14px}
table.t th,table.t td{border-bottom:1px solid var(--line);padding:9px 8px;text-align:left}
table.t th{color:var(--mut);font-size:12px;text-transform:uppercase;letter-spacing:.05em}
.grid3{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:14px}
.badge{border:1.5px solid var(--line);border-radius:14px;padding:12px;text-align:center}
.badge .ic{font-size:30px}
.badge.off{opacity:.35;filter:grayscale(1)}
.modalBg{position:fixed;inset:0;background:rgba(15,20,40,.55);display:grid;place-items:center;z-index:50;padding:20px}
.modal{background:#fff;border-radius:22px;padding:28px;max-width:420px;width:100%;text-align:center;animation:pop .35s}
@keyframes pop{from{transform:scale(.7);opacity:0}to{transform:scale(1);opacity:1}}
.bigLvl{width:110px;height:110px;margin:6px auto 10px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe680,#f2b705);display:grid;place-items:center;font:900 48px Nunito;color:#3b2a00;box-shadow:0 0 0 8px #fff3c4}
.toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%);background:var(--ink);color:#fff;padding:10px 18px;border-radius:999px;font-weight:800;z-index:60;animation:pop .25s}
.hidden{display:none!important}
.tbl-tbl td,.tbl-tbl th{border:1px solid var(--line);padding:6px 12px;text-align:center}
.tbl-tbl{border-collapse:collapse;margin:8px 0;font:700 17px "Cambria Math",Georgia,serif}
.status{font-size:11px;opacity:.8}
.ktpt td{vertical-align:top}.ktpt tr.knext td{background:#fff8dc}.ktpt tr.kpast td{opacity:.72}
.kobj{font-size:12.5px;color:var(--mut);max-width:380px}
.desc{background:#f6f7fc;border-left:4px solid var(--pri);border-radius:10px;padding:8px 12px;margin-top:12px;font-size:14px}
.bname{font:900 30px Nunito;margin:12px 0;min-height:44px;color:var(--mut);transition:.2s}
.bname.chosen{color:var(--pri);transform:scale(1.08)}
.tbars{display:flex;align-items:flex-end;gap:10px;height:180px;padding-top:20px}
.tb{flex:1;display:flex;flex-direction:column;align-items:center;height:100%;justify-content:flex-end}
.tbv{width:100%;max-width:46px;border-radius:8px 8px 0 0;position:relative;min-height:4px}
.tbv span{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font:900 11px Nunito}
.tbl{font:800 11px Nunito;color:var(--mut);margin-top:4px}
.jt td,.jt th{white-space:nowrap}.jt tr:hover td{background:#f6f7fc}
.mk{display:inline-grid;place-items:center;width:28px;height:28px;border-radius:8px;color:#fff}
.av{position:relative;border-radius:50%;padding:3px;flex:none;display:grid;place-items:center}
.avi{width:100%;height:100%;border-radius:50%;color:#fff;display:grid;place-items:center;font-weight:900;border:2px solid #fff}
.avl{position:absolute;right:-4px;bottom:-4px;background:var(--gold);color:#3b2a00;border-radius:999px;min-width:20px;height:20px;padding:0 4px;display:grid;place-items:center;font:900 11px Nunito;border:2px solid #fff}
.podium{display:flex;justify-content:center;align-items:flex-end;gap:14px;flex-wrap:wrap}
.pod{display:flex;flex-direction:column;align-items:center;text-align:center;width:170px}
.pn2{font-weight:900;margin-top:6px}
.pblock{width:100%;margin-top:8px;border-radius:12px 12px 0 0;display:grid;place-items:center;font-size:30px;color:#fff}
.pod.p1 .pblock{height:110px;background:linear-gradient(#ffd54a,#f2b705)} .pod.p2 .pblock{height:80px;background:linear-gradient(#e3e7f0,#b9c1d0)} .pod.p3 .pblock{height:60px;background:linear-gradient(#f3c39b,#d68a4f)}
.rrow{display:flex;align-items:center;gap:12px;padding:12px 6px;border-bottom:1px solid var(--line)} .rrow.me{background:var(--pri2);border-radius:12px}
.rk{width:32px;text-align:center;font-weight:900;font-size:18px} .rv{text-align:right;min-width:110px}
.lvtag{background:#fff4cc;color:#7a5d00;border-radius:999px;padding:2px 9px;font-weight:900;font-size:12px;white-space:nowrap}
.lvdot{display:inline-grid;place-items:center;width:20px;height:20px;border-radius:50%;background:var(--gold);color:#3b2a00;font:900 11px Nunito;margin-right:4px}
.xpline{height:7px;background:#eef1f6;border-radius:9px;overflow:hidden;margin-top:5px;max-width:420px} .xpline i{display:block;height:100%;background:linear-gradient(90deg,#ffd54a,#ff9f1c)}
.mini{display:inline-block;width:60px;height:6px;background:#eef1f6;border-radius:9px;overflow:hidden;margin-left:5px;vertical-align:middle} .mini i{display:block;height:100%}
.match{display:grid;grid-template-columns:1fr 1fr;gap:12px;max-width:720px}
.match>div{display:grid;gap:8px;align-content:start}
.mitem{border:2px solid var(--line);background:#fff;border-radius:12px;padding:11px 14px;font:700 17px "Cambria Math",Georgia,serif;cursor:pointer;text-align:left;transition:.15s}
.mitem:hover{border-color:var(--pri)} .mitem.sel{border-color:var(--pri);background:var(--pri2)}
.mitem.right{border-color:var(--ok);background:var(--ok2);cursor:default} .mitem.wrong{border-color:var(--bad);background:var(--bad2)}
.oitems{display:flex;flex-wrap:wrap;gap:10px}
.oitem{display:flex;align-items:center;gap:8px;min-width:110px;justify-content:center}
.onum{display:inline-grid;place-items:center;min-width:24px;height:24px;border-radius:50%;background:var(--pri);color:#fff;font:900 13px Nunito}
.onum:empty{background:#e3e7f0}
.pickgrid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:10px;max-width:900px}
.pickcard{position:relative;border:2.5px solid var(--line);border-radius:14px;background:#fff;padding:4px;cursor:pointer}
.pickcard svg{width:100%;height:auto;display:block}
.pickcard:hover{border-color:var(--pri)} .pickcard.sel{border-color:var(--pri);box-shadow:0 0 0 4px var(--pri2)}
.pickcard.right{border-color:var(--ok);box-shadow:0 0 0 4px var(--ok2)} .pickcard.wrong{border-color:var(--bad)}
.pl{position:absolute;top:6px;right:8px;background:var(--ink);color:#fff;border-radius:8px;padding:1px 8px;font:900 13px Nunito}
.figbox{max-width:460px;margin:4px 0 14px;border:1.5px solid var(--line);border-radius:14px;background:#fff;padding:6px}
.figbox svg{width:100%;height:auto;display:block}
.figbox.figok{border-color:var(--ok)} .figbox.figno{border-color:var(--bad)}
.tcard{border:2px solid var(--line);border-radius:20px;padding:20px 24px;margin-top:12px;min-height:340px;background:linear-gradient(180deg,#fff,#fafbff);animation:pop .3s}
.tc-h{display:flex;align-items:center;gap:12px;margin-bottom:12px}
.exstep{display:none;gap:12px;align-items:flex-start;font-size:20px;padding:10px 0;border-bottom:1px dashed var(--line)}
.exstep.show{display:flex;animation:pop .3s}
.ax,.thm{border-radius:12px;padding:10px 14px;margin:10px 0;font-size:16.5px}
.ax{background:#eef7f0;border-left:5px solid var(--ok)}
.thm{background:#f2efff;border-left:5px solid var(--vio)}
b.term{color:var(--pri)}
.goals{background:#f6f7fc;border-radius:12px;padding:10px 16px;margin-bottom:12px}
.goals li{margin:2px 0}
.qa{border:1.5px solid var(--line);border-radius:12px;padding:10px 14px;margin:8px 0}
.qa .an{display:none;color:var(--ok);font-weight:800;margin-top:6px}
.qa.open .an{display:block}
@media(max-width:640px){.me{margin-left:0;width:100%}.prob{font-size:19px}}

/* ================= ДИЗАЙН 2.0 ================= */
:root{--bg:#eef1fb;--pri:#4057e3;--pri2:#e9edff;--vio:#7b4fe0;--ink:#151a2e;--line:#e3e7f2;--sh:0 1px 2px rgba(20,30,80,.05),0 8px 28px rgba(40,55,140,.08)}
body{background:radial-gradient(1200px 600px at 100% -10%,#e3e1ff 0,transparent 60%),radial-gradient(900px 500px at -10% 30%,#dff3ff 0,transparent 55%),var(--bg);background-attachment:fixed;font-feature-settings:"tnum"}
body::before{content:"";position:fixed;inset:0;pointer-events:none;z-index:-1;opacity:.5;background-image:url("data:image/svg+xml;utf8,<svg xmlns='http://www.w3.org/2000/svg' width='260' height='260' font-family='Georgia' font-size='22' fill='%23c9cff0'><text x='20' y='40'>π</text><text x='150' y='70'>√x</text><text x='70' y='130'>Σ</text><text x='190' y='170'>x²</text><text x='30' y='220'>∠</text><text x='130' y='240'>△</text><text x='210' y='30'>∞</text></svg>")}
header{background:linear-gradient(115deg,#1b2266 0%,#3a4fd9 45%,#7b4fe0 80%,#b04fd0 100%);background-size:200% 200%;animation:hg 14s ease infinite;box-shadow:0 10px 30px rgba(40,40,140,.25);border-bottom:1px solid rgba(255,255,255,.15)}
@keyframes hg{0%,100%{background-position:0% 50%}50%{background-position:100% 50%}}
.logo{font-size:21px}
.nav button{backdrop-filter:blur(6px);transition:.18s;padding:7px 14px}
.nav button:hover{background:rgba(255,255,255,.28);transform:translateY(-1px)}
.nav button.on{box-shadow:0 4px 14px rgba(0,0,0,.18)}
.lvlBadge{background:conic-gradient(#ffd54a,#ff9f1c,#ffd54a);box-shadow:0 0 0 3px rgba(255,255,255,.6),0 0 18px rgba(255,200,60,.7);animation:pulse 2.6s ease-in-out infinite}
@keyframes pulse{50%{box-shadow:0 0 0 3px rgba(255,255,255,.8),0 0 28px rgba(255,200,60,.95)}}
.card,.section{border:1px solid rgba(255,255,255,.7);background:rgba(255,255,255,.92);box-shadow:var(--sh);border-radius:22px;backdrop-filter:blur(4px)}
.card{transition:box-shadow .2s}
h1{font-weight:900;letter-spacing:-.02em}
h2,h3{font-weight:900}
.btn{background:linear-gradient(180deg,#5068f0,#3a4fd9);box-shadow:0 4px 0 #2a3bb0,0 8px 18px rgba(58,79,217,.28);border-radius:14px;transition:transform .12s,filter .12s}
.btn:hover{filter:brightness(1.06);transform:translateY(-1px)}
.btn.ghost{background:#fff;box-shadow:0 2px 0 #e1e5f0}
.btn.ghost:hover{border-color:var(--pri);color:var(--pri)}
.btn.ok{background:linear-gradient(180deg,#25b874,#1d9d62);box-shadow:0 4px 0 #147447,0 8px 18px rgba(29,157,98,.25)}
.btn.gold{background:linear-gradient(180deg,#ffd24a,#f2b705);box-shadow:0 4px 0 #b68900,0 8px 18px rgba(242,183,5,.3)}
.prob{font:800 23px Nunito,system-ui,sans-serif;letter-spacing:-.005em}
.node{border-radius:18px;box-shadow:0 2px 0 #e3e7f2;background:linear-gradient(180deg,#fff,#f8f9ff)}
.node:hover{box-shadow:0 10px 24px rgba(58,79,217,.18)}
.choice{border-radius:14px!important;transition:.15s}
.choice:hover{transform:translateY(-2px);box-shadow:0 8px 18px rgba(58,79,217,.15)}
.pill{border-radius:999px}
table.t th{background:linear-gradient(180deg,#f5f7ff,#eef1fb)}
.board{background:linear-gradient(180deg,#fff,#fbfcff)!important}
.figbox{border-radius:16px;box-shadow:inset 0 0 0 1px #e8ecf6}
/* деңгей баспалдағы */
.hero{display:flex;gap:22px;align-items:center;padding:20px 24px;margin-bottom:16px;border-radius:24px;color:#fff;background:linear-gradient(120deg,#20287a,#4057e3 55%,#8d4fe0);box-shadow:0 14px 34px rgba(50,50,160,.3);position:relative;overflow:hidden}
.hero::after{content:"★";position:absolute;right:-20px;top:-60px;font-size:240px;opacity:.07}
.ring{--p:0;width:118px;height:118px;flex:none;border-radius:50%;display:grid;place-items:center;background:conic-gradient(#ffd54a calc(var(--p)*1%),rgba(255,255,255,.18) 0);box-shadow:0 0 30px rgba(255,210,80,.45)}
.ring>div{width:94px;height:94px;border-radius:50%;background:#232c86;display:grid;place-items:center;text-align:center;line-height:1}
.ring b{font:900 40px Nunito,system-ui,sans-serif;color:#ffd54a;display:block}.ring small{font-size:12px;opacity:.85;font-weight:800}
.hinfo{flex:1;min-width:0}.htitle{font:900 26px Nunito,system-ui,sans-serif}.hsub{opacity:.9;margin:2px 0 10px}
.ladder{display:flex;gap:6px;flex-wrap:wrap}
.ladder span{width:40px;height:40px;border-radius:12px;display:grid;place-items:center;font-size:20px;background:rgba(255,255,255,.1);filter:grayscale(1);opacity:.55;position:relative}
.ladder span i{display:none}
.ladder span.pas{filter:none;opacity:.95;background:rgba(255,255,255,.18)}
.ladder span.now{filter:none;opacity:1;background:#ffd54a;transform:scale(1.18);box-shadow:0 0 18px rgba(255,213,74,.9)}
.ladder span:hover i{display:block;position:absolute;top:46px;left:50%;transform:translateX(-50%);white-space:nowrap;background:#111633;color:#fff;font:800 11px Nunito,system-ui,sans-serif;font-style:normal;padding:3px 7px;border-radius:7px;z-index:3}
.tierb{display:inline-grid;place-items:center;width:22px;height:22px;border-radius:7px;font:900 12px Nunito,system-ui,sans-serif;color:#fff;vertical-align:middle}
.tierb.t0{background:#1d9d62}.tierb.t1{background:#e47a2e}.tierb.t2{background:#c2417a;box-shadow:0 0 10px rgba(194,65,122,.5)}
@media(max-width:640px){.hero{flex-direction:column;text-align:center}.ladder{justify-content:center}}
.mblane .prob{font-size:19px!important}.mblane .choices{grid-template-columns:1fr!important}.mblane .figbox{max-width:100%!important}.mblane input.txt{font-size:18px!important}

/* ===== v3 ===== */

 f:'(A) − (B + C) = A − B − C',
 ex:'(3x² + 2x) − (x² − 5x) = 2x² + 7x',
 br:'Қабырғалары x, x + 2 және 2x − 1 үшбұрыштың периметрі: P = 4x + 1.',
 it:null,
 g:()=>{const a=RN(-5,5),b=RN(-6,6),c=RN(-6,6),d=RN(-5,5),e=RN(-6,6),f=RN(-6,6),minus=Math.random()<.6;const A=`(${P([[a,2],[b,1],[c,0]])})`,B=`(${P([[d,2],[e,1],[f,0]])})`;if(minus)return {q:`${A} − ${B} = ?`,...C(P([[a-d,2],[b-e,1],[c-f,0]]),P([[a-d,2],[b+e,1],[c+f,0]]),P([[a+d,2],[b+e,1],[c+f,0]]),P([[a-d,2],[b-e,1],[c+f,0]])),h:'Екінші жақшадағы таңбаларды ауыстыр.'};return {q:`${A} + ${B} = ?`,...C(P([[a+d,2],[b+e,1],[c+f,0]]),P([[a+d,4],[b+e,2],[c+f,0]]),P([[a-d,2],[b-e,1],[c-f,0]]),P([[a+d,2],[b+e,1],[c-f,0]])),h:'Ұқсас мүшелерді қос.'}}},
{p:13,s:2,t:'Көпмүшелерді көбейту',
 th:'Көпмүшені көпмүшеге көбейту үшін бірінші көпмүшенің әр мүшесін екінші көпмүшенің әр мүшесіне көбейтіп, нәтижелерді қосамыз.',
 f:'(a + b)(c + d) = ac + ad + bc + bd',
 ex:'(x + 2)(x + 3) = x² + 3x + 2x + 6 = x² + 5x + 6',
 br:'(a + b)(c + d) – қабырғалары (a + b) және (c + d) тіктөртбұрыштың ауданы, ол төрт кіші тіктөртбұрыштың аудандарының қосындысына тең.',
 it:'rect',
 g:()=>{const a=RN(-6,6),b=RN(-6,6);return {q:`(x ${sg(a)})(x ${sg(b)}) = ?`,...C(P([[1,2],[a+b,1],[a*b,0]]),P([[1,2],[a*b,1],[a+b,0]]),P([[1,2],[a*b,0]]),P([[1,2],[a+b,1],[-a*b,0]]),P([[1,2],[-(a+b),1],[a*b,0]])),h:'Әр мүшені әр мүшеге көбейт.'}}},
{p:14,s:2,t:'Бірмүше мен көпмүшені бірмүшеге бөлу',
 th:'Көпмүшені бірмүшеге бөлу үшін көпмүшенің әр мүшесін сол бірмүшеге бөліп, нәтижелерін қосамыз.',
 f:'(A + B) : C = A : C + B : C',
 ex:'(6x³ − 4x²) : 2x = 3x² − 2x',
 br:'Тіктөртбұрыштың ауданы 6x² + 4x, ені 2x болса, ұзындығы (6x² + 4x) : 2x = 3x + 2.',
 it:null,
 g:()=>{const k=R(2,5),a=RN(-5,5),b=RN(-6,6);return {q:`(${P([[k*a,3],[k*b,2]])}) : ${k}x = ?`,...C(P([[a,2],[b,1]]),P([[a,3],[b,2]]),P([[k*a,2],[k*b,1]]),P([[a,2],[-b,1]])),h:'Әр мүшені бөл: коэффициенттерді бөліп, көрсеткіштерді азайт.'}}},
{p:15,s:2,t:'Ортақ көбейткішті жақшаның сыртына шығару',
 th:'Көпмүшенің барлық мүшелерінде бар ортақ көбейткішті жақшаның сыртына шығарамыз. Бұл көбейтудің үлестірімділік заңын керісінше қолдану.',
 f:'ab + ac = a(b + c)',
 ex:'5x² + 10x = 5x(x + 2)',
 br:'Ауданы 5x² + 10x тіктөртбұрыштың қабырғаларын 5x және x + 2 деп алуға болады.',
 it:'rect',
 g:()=>{const k=R(2,6),b=RN(-7,7);return {q:`${P([[k,2],[k*b,1]])} = ?`,...C(`${k}x(x ${sg(b)})`,`${k}x(x ${sg(-b)})`,`${k}x(x ${sg(k*b)})`,`x(${k}x ${sg(b)})`),h:`Ортақ көбейткіш – ${k}x.`}}},
{p:16,s:2,t:'Көпмүшені топтау тәсілімен көбейткіштерге жіктеу',
 th:'Мүшелерді ортақ көбейткіші бар топтарға бөліп, әр топтан ортақ көбейткішті шығарамыз, содан кейін пайда болған ортақ жақшаны шығарамыз.',
 f:'ax + ay + bx + by = a(x + y) + b(x + y) = (x + y)(a + b)',
 ex:'x² + 3x + 2x + 6 = x(x + 3) + 2(x + 3) = (x + 3)(x + 2)',
 br:'Төрт тіктөртбұрышты бір үлкен тіктөртбұрышқа құрастыру – топтау тәсілінің геометриялық мағынасы.',
 it:'rect',
 g:()=>{const a=RN(-6,6),b=RN(-6,6);return {q:`x² ${sg(a)}x ${sg(b)}x ${sg(a*b)} = ?`,...C(`(x ${sg(a)})(x ${sg(b)})`,`(x ${sg(-a)})(x ${sg(-b)})`,`(x ${sg(a)})(x ${sg(-b)})`,`x(x ${sg(a+b)})`),h:'Алғашқы екі мүшені және соңғы екі мүшені топтастыр.'}}},
{p:17,s:2,t:'Өрнектерді тепе-тең түрлендіру',
 th:'Айнымалылардың кез келген мүмкін мәнінде мәндері тең өрнектер тепе-тең деп аталады. Ықшамдағаннан кейін өрнектің мәні кейде айнымалыға тәуелсіз болады.',
 f:'(x + a)(x − a) − x² = −a²',
 ex:'(x + 3)(x − 3) − x² + 10 = x² − 9 − x² + 10 = 1 (кез келген x үшін)',
 br:'Тепе-теңдіктерді аудан арқылы тексеруге болады: екі фигураның аудандары тең болса, өрнектер тепе-тең.',
 it:null,
 g:()=>{const t=R(0,1),a=R(2,9),c=R(-20,20),x=R(11,99);if(t)return {q:`Өрнектің мәнін тап: (x + ${a})(x − ${a}) − x² ${sg(c)}, &nbsp;x = ${x}`,ans:c-a*a,h:'Алдымен ықшамда – x жойылады!'};return {q:`Өрнектің мәнін тап: ${a}(x + ${a}) − ${a}x ${sg(c)}, &nbsp;x = ${x}`,ans:a*a+c,h:'Жақшаны аш, ұқсас мүшелерді біріктір.'}}},
/* ---------------- III бөлім ---------------- */
{p:18,s:3,t:'Функция',
 th:'x айнымалысының әр мәніне y айнымалысының бір ғана мәні сәйкес келетін тәуелділік функция деп аталады. x – тәуелсіз айнымалы (аргумент), y = f(x) – функцияның мәні.',
 f:'y = f(x)',
 ex:'f(x) = 2x + 3 болса, f(4) = 2·4 + 3 = 11',
 br:'Квадраттың периметрі P = 4a – оның қабырғасының функциясы; ауданы S = a² – тағы бір функция.',
 it:'linear',
 g:()=>{const a=RN(-5,5),b=R(-9,9),c=R(-6,6);return {q:`f(x) = ${P([[a,1],[b,0]])}. &nbsp;f(${String(c).replace('-','−')}) = ?`,ans:a*c+b,h:`x орнына ${c} қой.`}}},
{p:19,s:3,t:'Функцияны формула арқылы беру',
 th:'Функция формуламен берілсе, x-тің мәні бойынша y-ті, ал y-тің мәні бойынша теңдеу шешіп x-ті табамыз.',
 f:'y = kx + b ⇒ x = (y − b) / k',
 ex:'y = 3x − 2, y = 10 болса, 3x − 2 = 10, x = 4',
 br:'Шеңбердің ұзындығы C = 2πr. C белгілі болса, радиусы r = C / 2π.',
 it:'linear',
 g:()=>{const k=RN(-5,5),b=R(-9,9),x=R(-8,8),y=k*x+b;return {q:`y = ${P([[k,1],[b,0]])} функциясы y = ${y} мәнін қандай x-те қабылдайды?`,ans:x,h:`${P([[k,1],[b,0]])} = ${y} теңдеуін шеш.`}}},
{p:20,s:3,t:'Функцияны кестемен беру тәсілі',
 th:'Аргументтің бірнеше мәні мен оларға сәйкес функция мәндері кесте түрінде беріледі. Кестеден заңдылықты байқап, формуланы табуға болады.',
 f:'x | x₁ | x₂ | … &nbsp;→&nbsp; y | y₁ | y₂ | …',
 ex:'x: 1, 2, 3 → y: 5, 7, 9. Әр қадамда y 2-ге артады: y = 2x + 3',
 br:'Квадраттың қабырғасы мен ауданының кестесі: 1→1, 2→4, 3→9 – бұл y = x² функциясы.',
 it:'linear',
 g:()=>{const k=RN(-4,5),b=R(-6,6),xs=[0,1,2,3,4],mi=R(1,4);const ys=xs.map(x=>k*x+b);return {q:`y = kx + b. Кестедегі белгісіз мәнді тап:<table class="tbl-tbl"><tr><th>x</th>${xs.map(x=>`<td>${x}</td>`).join('')}</tr><tr><th>y</th>${ys.map((y,i)=>`<td>${i===mi?'?':String(y).replace('-','−')}</td>`).join('')}</tr></table>`,ans:ys[mi],h:'Көршілес мәндердің айырмасын тап – ол k.'}}},
{p:21,s:3,t:'Функцияны графиктік тәсілмен беру',
 th:'Функцияның графигі – координаталары (x; f(x)) болатын нүктелер жиыны. A(x₀; y₀) нүктесі графикке тиісті болуы үшін y₀ = f(x₀) теңдігі орындалуы керек.',
 f:'A(x₀; y₀) ∈ графикке ⇔ y₀ = f(x₀)',
 ex:'y = 2x − 1. A(3; 5): 2·3 − 1 = 5 – тиісті. B(1; 4): 2·1 − 1 = 1 ≠ 4 – тиісті емес.',
 br:'Координаталық жазықтық – алгебра мен геометрияның түйіскен жері: сан жұбы – нүкте, теңдеу – сызық.',
 it:'linear',
 g:()=>{if(Math.random()<.5){const k=RN(-4,4),b=R(-6,6),x=R(-5,5);return {q:`A(${x}; y) нүктесі y = ${P([[k,1],[b,0]])} графигіне тиісті. y = ?`,ans:k*x+b,h:'x-ті формулаға қой.'}}const k=RN(-4,4),b=R(-6,6),x=R(-4,4),y=k*x+b,w=y+RN(-3,3);const pts=shuf([[x,y,1],[x,w,0],[x+1,y,0],[-x||2,y+1,0]]);const right=`(${String(x).replace('-','−')}; ${String(y).replace('-','−')})`;return {q:`Қай нүкте y = ${P([[k,1],[b,0]])} графигіне тиісті?`,...C(right,...pts.filter(p=>!p[2]).map(p=>`(${String(p[0]).replace('-','−')}; ${String(p[1]).replace('-','−')})`)),h:'Әр нүктені формулаға қойып тексер.'}}},
{p:22,s:3,t:'Сызықтық функция және оның графигі',
 th:'y = kx + b түріндегі функция сызықтық функция деп аталады. Графигі – түзу. k – бұрыштық коэффициент: k > 0 болса функция өседі, k < 0 болса кемиді. b – түзудің Oy осін қиятын нүктесінің ординатасы.',
 f:'y = kx + b',
 ex:'y = 2x − 4: Oy осін (0; −4), Ox осін 2x − 4 = 0, x = 2 нүктесінде қияды.',
 br:'k – түзу мен Ox осінің арасындағы бұрыштың көлбеулігі. k = 1 болса, бұрыш 45°.',
 it:'linear',
 g:()=>{const t=R(0,2);if(t===0){const k=RN(-5,5),x0=R(-5,5),b=-k*x0;return {q:`y = ${P([[k,1],[b,0]])} графигі Ox осін қай x нүктесінде қияды?`,ans:x0,h:'y = 0 деп теңдеу шеш.'}}if(t===1){const k=RN(-5,5),b=R(-9,9);return {q:`y = ${P([[k,1],[b,0]])} графигі Oy осін қай y нүктесінде қияды?`,ans:b,h:'x = 0 қой.'}}const k=RN(-5,5),b=R(-5,5);return {q:`y = ${P([[k,1],[b,0]])} функциясы…`,...C(k>0?'өседі':'кемиді',k>0?'кемиді':'өседі','тұрақты'),h:'k таңбасына қара.'}}},
{p:23,s:3,t:'Сызықтық функциялар графиктерінің өзара орналасуы',
 th:'y = k₁x + b₁ және y = k₂x + b₂ түзулері: k₁ ≠ k₂ болса – қиылысады; k₁ = k₂, b₁ ≠ b₂ болса – параллель; k₁ = k₂, b₁ = b₂ болса – беттеседі.',
 f:'k₁ = k₂, b₁ ≠ b₂ ⇒ параллель',
 ex:'y = 3x + 1 және y = 3x − 5 – параллель; y = 3x + 1 және y = −x + 1 – (0; 1) нүктесінде қиылысады.',
 br:'Геометриядағы параллель түзулер алгебрада бірдей k коэффициентімен беріледі.',
 it:'linear',
 g:()=>{const t=R(0,2),k=RN(-4,4),b=R(-5,5);let k2=k,b2=b;if(t===0){b2=b+RN(-4,4)}else if(t===1){k2=k+RN(-3,3)}const ans=['параллель','қиылысады','беттеседі'][t];return {q:`y = ${P([[k,1],[b,0]])} және y = ${P([[k2,1],[b2,0]])} түзулері…`,...C(ans,...['параллель','қиылысады','беттеседі']),h:'k мен b-ны салыстыр.'}}},
{p:24,s:3,t:'Екі айнымалысы бар сызықтық теңдеулер жүйесін графиктік тәсілмен шешу',
 th:'Жүйенің әр теңдеуінің графигін (түзуді) саламыз. Түзулердің қиылысу нүктесінің координаталары – жүйенің шешімі. Түзулер параллель болса – шешімі жоқ, беттессе – шешімі шексіз көп.',
 f:'{ y = k₁x + b₁ ; y = k₂x + b₂ } → қиылысу нүктесі (x; y)',
 ex:'{ y = x + 1 ; y = −x + 3 } → x + 1 = −x + 3, x = 1, y = 2. Шешімі (1; 2).',
 br:'Шешімнің өзі – геометриялық нысан: екі түзудің ортақ нүктесі.',
 it:'system',
 g:()=>{const x=R(-4,4),y=R(-4,4),k1=RN(-3,3);let k2;do{k2=RN(-3,3)}while(k2===k1);const b1=y-k1*x,b2=y-k2*x;const f=(a,b)=>`(${String(a).replace('-','−')}; ${String(b).replace('-','−')})`;return {q:`Жүйенің шешімі: { y = ${P([[k1,1],[b1,0]])} ; y = ${P([[k2,1],[b2,0]])} }`,...C(f(x,y),f(y,x),f(-x,y),f(x,-y),f(x+1,y)),h:'Оң жақтарын теңестіріп, x-ті тап.'}}},
{p:25,s:3,t:'y = ax² (a ≠ 0) функциясы, оның графигі және қасиеттері',
 th:'Графигі – парабола. Төбесі (0; 0), симметрия осі – Oy осі. a > 0 болса тармақтары жоғары, a < 0 болса төмен бағытталған. |a| үлкен болған сайын парабола «жіңішкереді».',
 f:'y = ax²: &nbsp; f(−x) = f(x)',
 ex:'y = 2x²: f(3) = 18, f(−3) = 18',
 br:'Квадраттың ауданы S = a² – параболаның оң тармағы. Қабырғасы 2 есе ұлғайса, аудан 4 есе ұлғаяды.',
 it:'parab',
 g:()=>{if(Math.random()<.3){const a=RN(-4,4);return {q:`y = ${P([[a,2]])} параболасының тармақтары…`,...C(a>0?'жоғары':'төмен',a>0?'төмен':'жоғары','оңға','солға'),h:'a таңбасына қара.'}}const a=RN(-3,3),x=RN(-4,4);return {q:`y = ${P([[a,2]])}. &nbsp;x = ${par(x)} болғанда y = ?`,ans:a*x*x,h:'Алдымен x²-ты есепте.'}}},
{p:26,s:3,t:'y = ax³ (a ≠ 0) функциясы, оның графигі және қасиеттері',
 th:'Графигі – кубтық парабола. Ол координаталар басына қатысты симметриялы: f(−x) = −f(x). a > 0 болса функция өседі, a < 0 болса кемиді.',
 f:'y = ax³: &nbsp; f(−x) = −f(x)',
 ex:'y = x³: f(2) = 8, f(−2) = −8',
 br:'Кубтың көлемі V = a³. Қыры 2 есе ұлғайса, көлемі 2³ = 8 есе ұлғаяды.',
 it:'cubic',
 g:()=>{const a=RN(-2,2),x=RN(-3,3);return {q:`y = ${P([[a,3]])}. &nbsp;x = ${par(x)} болғанда y = ?`,ans:a*x**3,h:'Алдымен x³-ты есепте (таңбаға назар!).'}}},
{p:27,s:3,t:'y = k/x (k ≠ 0) функциясы, оның графигі және қасиеттері',
 th:'Кері пропорционалдық. Графигі – гипербола, екі тармақтан тұрады. k > 0 болса тармақтары I және III ширекте, k < 0 болса II және IV ширекте. x ≠ 0.',
 f:'y = k / x, &nbsp; x · y = k',
 ex:'y = 12/x: x = 3 болса y = 4; гипербола A(2; 6) нүктесі арқылы өтеді.',
 br:'Ауданы S тұрақты тіктөртбұрыштың ұзындығы мен ені кері пропорционал: b = S / a – гипербола.',
 it:'hyper',
 g:()=>{if(Math.random()<.5){const x=RN(-6,6),y=RN(-6,6);return {q:`y = k/x гиперболасы A(${par(x)}; ${par(y)}) нүктесі арқылы өтеді. k = ?`,ans:x*y,h:'k = x · y'}}const x=pick([1,2,3,4,6,-2,-3]),y=RN(-6,6),k=x*y;return {q:`y = ${String(k).replace('-','−')}/x. &nbsp;x = ${par(x)} болғанда y = ?`,ans:y,h:'k-ны x-ке бөл.'}}},
/* ---------------- IV бөлім ---------------- */
{p:28,s:4,t:'Вариациялық қатар',
 th:'Деректерді өсу ретімен орналастырсақ, вариациялық қатар шығады. Қатардың құлашы – ең үлкен және ең кіші мәндердің айырмасы. Мода – ең жиі кездесетін мән.',
 f:'Құлашы = x<sub>max</sub> − x<sub>min</sub>',
 ex:'5, 3, 8, 3, 6 → 3, 3, 5, 6, 8. Құлашы 8 − 3 = 5, модасы 3.',
 br:'Сан осінде қатардың құлашы – ең шеткі екі нүктенің арасындағы кесіндінің ұзындығы.',
 it:'polygon',
 g:()=>{const n=R(6,8),arr=[];for(let i=0;i<n;i++)arr.push(R(1,20));if(Math.random()<.5)return {q:`Деректер: ${arr.join('; ')}. &nbsp;Қатардың құлашы = ?`,ans:Math.max(...arr)-Math.min(...arr),h:'Ең үлкенінен ең кішісін азайт.'};const m=R(2,15),a=shuf([m,m,m,...arr.slice(0,4).filter(x=>x!==m)]);return {q:`Деректер: ${a.join('; ')}. &nbsp;Мода = ?`,ans:m,h:'Ең жиі кездесетін санды тап.'}}},
{p:29,s:4,t:'Абсолюттік жиілік және салыстырмалы жиілік. Жиіліктер кестесі',
 th:'Абсолюттік жиілік – мәннің деректерде неше рет кездесетіні. Салыстырмалы жиілік – абсолюттік жиіліктің деректердің жалпы санына қатынасы (бөлшек немесе пайыз). Барлық салыстырмалы жиіліктердің қосындысы 1 (100%).',
 f:'w = m / n',
 ex:'20 оқушының 5-еуі «5» алды: абсолюттік жиілік 5, салыстырмалы жиілік 5/20 = 0,25 = 25%.',
 br:'Салыстырмалы жиіліктер дөңгелек диаграммада секторлар түрінде көрсетіледі: 25% – 90°-тық сектор.',
 it:'polygon',
 g:()=>{if(Math.random()<.5){const n=pick([10,20,25,50]),m=R(1,n-1);return {q:`${n} деректің ішінде бір мән ${m} рет кездеседі. Оның салыстырмалы жиілігі (ондық бөлшек) = ?`,ans:m/n,h:'m / n'}}const v=R(2,5),arr=shuf([...Array(R(2,5)).fill(v),...Array(R(4,6)).fill(0).map(()=>{let x;do{x=R(1,6)}while(x===v);return x})]);return {q:`Ұпайлар: ${arr.join('; ')}. &nbsp;${v} санының абсолюттік жиілігі = ?`,ans:arr.filter(x=>x===v).length,h:`${v} санын санап шық.`}}},
{p:30,s:4,t:'Жиілік полигоны',
 th:'Жиілік полигоны – координаталары (мән; жиілік) болатын нүктелерді кесінділермен ретімен қосқанда шығатын сынық сызық. Полигоннан ең жиі мәнді (модасын) бірден көруге болады.',
 f:'Нүктелер (xᵢ; mᵢ) → сынық сызық',
 ex:'Баға: 2, 3, 4, 5; жиілігі: 1, 4, 9, 6. Полигонның ең биік нүктесі (4; 9) – мода 4.',
 br:'Полигон – координаталық жазықтықтағы сынық сызық, оның әр буыны – кесінді.',
 it:'polygon',
 g:()=>{const xs=[2,3,4,5],ms=xs.map(()=>R(1,9));const mx=Math.max(...ms);if(ms.filter(m=>m===mx).length>1)ms[ms.indexOf(mx)]=mx+1;const M=Math.max(...ms);const tb=`<table class="tbl-tbl"><tr><th>Баға</th>${xs.map(x=>`<td>${x}</td>`).join('')}</tr><tr><th>Жиілік</th>${ms.map(m=>`<td>${m}</td>`).join('')}</tr></table>`;if(Math.random()<.5)return {q:`Полигонның ең биік нүктесіне сәйкес баға (мода) = ?${tb}`,ans:xs[ms.indexOf(M)],h:'Ең үлкен жиілікті тап.'};return {q:`Барлығы неше оқушы бағаланды?${tb}`,ans:ms.reduce((a,b)=>a+b,0),h:'Жиіліктерді қос.'}}},
/* ---------------- V бөлім ---------------- */
{p:31,s:5,t:'Екі өрнектің квадраттарының айырымының формуласы',
 th:'Екі өрнектің квадраттарының айырымы олардың айырымы мен қосындысының көбейтіндісіне тең. Формула ауызша есептеуге өте ыңғайлы.',
 f:'a² − b² = (a − b)(a + b)',
 ex:'x² − 25 = (x − 5)(x + 5); &nbsp; 53² − 47² = 6 · 100 = 600',
 br:'Қабырғасы a квадраттан қабырғасы b квадратты қиып алсақ, қалған бөлікті қабырғалары (a − b) және (a + b) тіктөртбұрышқа құрастыруға болады.',
 it:'diffsq',
 g:()=>{if(Math.random()<.5){const a=R(30,95),b=a-R(2,12);return {q:`Ыңғайлы тәсілмен есепте: ${a}² − ${b}² = ?`,ans:(a-b)*(a+b),h:`(${a} − ${b})(${a} + ${b})`}}const a=R(2,9),k=pick([1,1,4,9]);const A=k===1?'x':`${Math.sqrt(k)}x`;return {q:`${k===1?'':k}x² − ${a*a} = ?`,...C(`(${A} − ${a})(${A} + ${a})`,`(${A} − ${a})²`,`(${A} − ${a*a})(${A} + ${a*a})`,`(${A} + ${a})²`),h:'a² − b² = (a − b)(a + b)'}}},
{p:32,s:5,t:'Екі өрнектің қосындысының квадраты және айырымының квадраты',
 th:'Қосындының квадраты: бірінші өрнектің квадраты, плюс екі өрнектің көбейтіндісін екі еселегені, плюс екінші өрнектің квадраты. Айырымның квадратында ортаңғы мүше «−» таңбамен алынады.',
 f:'(a + b)² = a² + 2ab + b², &nbsp; (a − b)² = a² − 2ab + b²',
 ex:'(x + 3)² = x² + 6x + 9; &nbsp; 49² = (50 − 1)² = 2500 − 100 + 1 = 2401',
 br:'Қабырғасы (a + b) квадрат a² квадратқа, b² квадратқа және екі ab тіктөртбұрышқа бөлінеді.',
 it:'sq',
 g:()=>{if(Math.random()<.4){const base=pick([20,30,40,50,60,70,80,90,100]),d=pick([-2,-1,1,2,3]);const n=base+d;return {q:`Формуламен ауызша есепте: ${n}² = ?`,ans:n*n,h:`(${base} ${sg(d)})²`}}const a=RN(-8,8);return {q:`(x ${sg(a)})² = ?`,...C(P([[1,2],[2*a,1],[a*a,0]]),P([[1,2],[a*a,0]]),P([[1,2],[a,1],[a*a,0]]),P([[1,2],[-2*a,1],[a*a,0]]),P([[1,2],[2*a,1],[-a*a,0]])),h:'a² + 2ab + b²'}}},
{p:33,s:5,t:'Екі өрнектің қосындысының кубы мен айырымының кубы',
 th:'Қосындының кубы төрт мүшеден тұрады. Айырымның кубында мүшелердің таңбалары кезектесіп келеді.',
 f:'(a + b)³ = a³ + 3a²b + 3ab² + b³, &nbsp; (a − b)³ = a³ − 3a²b + 3ab² − b³',
 ex:'(x + 2)³ = x³ + 6x² + 12x + 8',
 br:'Қыры (a + b) кубты 8 бөлікке бөлуге болады: a³ куб, b³ куб, үш a²b және үш ab² параллелепипед.',
 it:'cube3',
 g:()=>{const a=RN(-3,3);return {q:`(x ${sg(a)})³ = ?`,...C(P([[1,3],[3*a,2],[3*a*a,1],[a**3,0]]),P([[1,3],[a**3,0]]),P([[1,3],[3*a,2],[3*a,1],[a**3,0]]),P([[1,3],[a,2],[a*a,1],[a**3,0]])),h:'a³ + 3a²b + 3ab² + b³'}}},
{p:34,s:5,t:'Екі өрнектің кубтарының қосындысы мен айырымы',
 th:'Кубтардың қосындысы (айырымы) өрнектердің қосындысы (айырымы) мен «толымсыз квадраттың» көбейтіндісіне тең.',
 f:'a³ + b³ = (a + b)(a² − ab + b²), &nbsp; a³ − b³ = (a − b)(a² + ab + b²)',
 ex:'x³ − 8 = (x − 2)(x² + 2x + 4)',
 br:'Қыры a кубтан қыры b кубты алып тастағандағы қалған дененің көлемі a³ − b³.',
 it:null,
 g:()=>{const a=R(1,5),plus=Math.random()<.5,c=a**3;if(plus)return {q:`x³ + ${c} = ?`,...C(`(x + ${a})(x² − ${a===1?'':a}x + ${a*a})`,`(x + ${a})(x² + ${a===1?'':a}x + ${a*a})`,`(x + ${a})³`,`(x − ${a})(x² + ${a===1?'':a}x + ${a*a})`),h:'a³ + b³ = (a + b)(a² − ab + b²)'};return {q:`x³ − ${c} = ?`,...C(`(x − ${a})(x² + ${a===1?'':a}x + ${a*a})`,`(x − ${a})(x² − ${a===1?'':a}x + ${a*a})`,`(x − ${a})³`,`(x + ${a})(x² − ${a===1?'':a}x + ${a*a})`),h:'a³ − b³ = (a − b)(a² + ab + b²)'}}},
{p:35,s:5,t:'Қысқаша көбейту формулаларының көмегімен өрнектерді түрлендіру',
 th:'Бірнеше формуланы қатар қолданып, өрнекті ықшамдаймыз, содан кейін мәнін есептейміз. Ықшамдау есептеуді айтарлықтай жеңілдетеді.',
 f:'(x + a)² − (x − a)² = 4ax',
 ex:'(x + 5)² − (x − 5)² = 20x; x = 3 болса, 60',
 br:'(x + a)² − (x − a)² – екі квадраттың аудандарының айырымы, ол 4 тіктөртбұрыштың ауданына (4ax) тең.',
 it:'sq',
 g:()=>{if(Math.random()<.5){const a=R(1,9),x=R(2,15);return {q:`(x + ${a})² − (x − ${a})² өрнегінің x = ${x} болғандағы мәні = ?`,ans:4*a*x,h:'Ықшамда: 4ax.'}}const a=R(1,9),x=R(10,99);return {q:`(x − ${a})(x + ${a}) − (x² − ${a*a+R(1,20)}) өрнегінің мәні (x = ${x})`,ans:null,_gen:true}}},
{p:36,s:5,t:'Мәтінді есептерді шығару',
 th:'Белгісізді x деп белгілеп, есеп шартын теңдеуге аударамыз. Қысқаша көбейту формулалары теңдеуді ықшамдауға көмектеседі.',
 f:'(x + a)² − x² = 2ax + a²',
 ex:'Квадраттың қабырғасын 3 см ұзартқанда ауданы 39 см²-қа артты: (x + 3)² − x² = 39, 6x + 9 = 39, x = 5 см.',
 br:'Аудан мен периметрге берілген мәтінді есептер – алгебра мен геометрияның нағыз бірлігі.',
 it:'sq',
 g:()=>{const x=R(3,15),a=R(1,6),S=2*a*x+a*a;return {q:`Квадраттың қабырғасын ${a} см ұзартқанда, оның ауданы ${S} см²-қа артты. Бастапқы квадраттың қабырғасы (см) = ?`,ans:x,h:`(x + ${a})² − x² = ${S} ⇒ ${2*a}x + ${a*a} = ${S}`}}},
/* ---------------- VI бөлім ---------------- */
{p:37,s:6,t:'Алгебралық бөлшек',
 th:'A/B түріндегі өрнек (A, B – көпмүшелер) алгебралық бөлшек деп аталады. Бөлімі нөлге айналатын айнымалы мәндерінде бөлшектің мағынасы болмайды.',
 f:'A / B, &nbsp; B ≠ 0',
 ex:'(x + 1)/(x − 4): x = 4 болғанда мағынасы жоқ; x = 6 болса, мәні 7/2 = 3,5',
 br:'Тіктөртбұрыштың ауданы S, ұзындығы a болса, ені b = S/a – алгебралық бөлшек (a ≠ 0).',
 it:null,
 g:()=>{if(Math.random()<.5){const b=RN(-9,9);return {q:`(x ${sg(R(1,9))}) / (x ${sg(-b)}) бөлшегінің мағынасы болмайтын x мәні = ?`,ans:b,h:'Бөлімді нөлге теңестір.'}}const d=RN(-4,4),x=R(-5,9);if(x-d===0)return {q:`(2x + 4)/(x + 2) бөлшегінің x = 3 болғандағы мәні`,ans:2,h:'Мәнін қойып есепте.'};const b=d,num=x*(x-b)+0;return {q:`(x² ${sg(-b)}x) / (x ${sg(-b)}) бөлшегінің x = ${x} болғандағы мәні = ?`,ans:x,h:'Алымынан x-ті шығарып, қысқарт.'}}},
{p:38,s:6,t:'Алгебралық бөлшектің негізгі қасиеті',
 th:'Бөлшектің алымы мен бөлімін нөлден өзгеше бір өрнекке көбейтсек немесе бөлсек, бөлшектің мәні өзгермейді. Бұл қасиет бойынша бөлшектерді қысқартамыз.',
 f:'A / B = (A · C) / (B · C), &nbsp; C ≠ 0',
 ex:'(x² − 9)/(x − 3) = (x − 3)(x + 3)/(x − 3) = x + 3',
 br:'Ұқсас үшбұрыштардың қабырғаларының қатынасы бірдей: 3/4 = 6/8 = 9/12 – бөлшектің негізгі қасиеті.',
 it:null,
 g:()=>{const t=R(0,2),a=R(1,9);if(t===0)return {q:`Қысқарт: (x² − ${a*a}) / (x − ${a})`,...C(`x + ${a}`,`x − ${a}`,`x + ${a*a}`,`x`),h:'Алымын (x − a)(x + a) деп жікте.'};if(t===1){const k=R(2,9);return {q:`Қысқарт: (${k}x ${sg(k*a)}) / (x + ${a})`,...C(`${k}`,`${k}x`,`${k*a}`,`x + ${k}`),h:'Алымынан ортақ көбейткішті шығар.'}}const k=R(2,6);return {q:`Қысқарт: (x² + ${2*a}x + ${a*a}) / (${k}x + ${k*a})`,...C(`(x + ${a}) / ${k}`,`x + ${a}`,`(x + ${a}) / (${k}x)`,`${k}(x + ${a})`),h:'Алымы – толық квадрат (x + a)².'}}},
{p:39,s:6,t:'Алгебралық бөлшектерді қосу және азайту',
 th:'Бөлімдері бірдей бөлшектерді қосқанда (азайтқанда) алымдарын қосамыз (азайтамыз), бөлімі өзгермейді. Бөлімдері әртүрлі болса, алдымен ортақ бөлімге келтіреміз.',
 f:'A/C ± B/C = (A ± B)/C, &nbsp; A/B + C/D = (AD + BC)/BD',
 ex:'3/x + 5/x = 8/x; &nbsp; 1/x + 1/(2x) = 3/(2x)',
 br:'Бөлшектерді қосу – бір тұтастың бөліктерін біріктіру: шеңбердің 1/4 және 1/3 бөлігі бірге 7/12 бөлігі.',
 it:null,
 g:()=>{const t=R(0,2),a=R(1,9),b=R(1,9);if(t===0)return {q:`${a}/x + ${b}/x = ?`,...C(`${a+b}/x`,`${a+b}/(2x)`,`${a*b}/x`,`${a+b}/x²`),h:'Алымдарын қос.'};if(t===1)return {q:`(x + ${a})/(x − 2) − (${a} + 2)/(x − 2) = ?`,...C('1',`(x + ${2*a+2})/(x − 2)`,`x/(x − 2)`,`x − 2`),h:'Алымдарын азайт: x + a − a − 2 = x − 2.'};return {q:`1/x + 1/(${a+1}x) = ?`,...C(`${a+2}/(${a+1}x)`,`2/(${a+2}x)`,`2/(${a+1}x)`,`${a+2}/x`),h:`Ортақ бөлім ${a+1}x.`}}},
{p:40,s:6,t:'Алгебралық бөлшектерді көбейту, дәрежеге шығару және бөлу',
 th:'Бөлшектерді көбейткенде алымды алымға, бөлімді бөлімге көбейтеміз. Бөлгенде бірінші бөлшекті екіншісіне кері бөлшекке көбейтеміз. Дәрежеге шығарғанда алымы мен бөлімі бөлек дәрежеге шығарылады.',
 f:'A/B · C/D = AC/BD, &nbsp; A/B : C/D = AD/BC, &nbsp; (A/B)ⁿ = Aⁿ/Bⁿ',
 ex:'(3x/5) · (10/x²) = 6/x; &nbsp; (x/2)³ = x³/8',
 br:'Ұқсастық коэффициенті k = a/b болса, аудандар қатынасы (a/b)² = a²/b².',
 it:null,
 g:()=>{const t=R(0,2),a=R(2,6),b=R(2,6);if(t===0)return {q:`(${a}x / ${b}) · (${b} / x²) = ?`,...C(`${a}/x`,`${a}x`,`${a*b}/x`,`${a}/x²`),h:'Көбейтіп, қысқарт.'};if(t===1)return {q:`(x / ${a})${sup(b>3?2:3)} = ?`,...C(`x${sup(b>3?2:3)}/${a**(b>3?2:3)}`,`x${sup(b>3?2:3)}/${a}`,`x/${a**(b>3?2:3)}`,`${b>3?2:3}x/${a}`),h:'Алым мен бөлімді бөлек дәрежеге шығар.'};return {q:`(${a}/x) : (${a*b}/x²) = ?`,...C(`x/${b}`,`${b}/x`,`${b}x`,`1/(${b}x)`),h:'Екінші бөлшекті аударып, көбейт.'}}},
{p:41,s:6,t:'Алгебралық өрнектерді тепе-тең түрлендіру',
 th:'Бөлшектерге амалдарды, жіктеу мен қысқаша көбейту формулаларын бірге қолданып, өрнекті ең қарапайым түрге келтіреміз. Ықшамдалған өрнектің мәнін есептеу оңай.',
 f:'(x² − a²)/(x − a) − x = a',
 ex:'(x² − 16)/(x − 4) − x = x + 4 − x = 4',
 br:'Күрделі фигураның ауданын бөліктерге бөліп есептеу де тепе-тең түрлендіру сияқты: нәтиже бөлу тәсіліне тәуелді емес.',
 it:null,
 g:()=>{const t=R(0,1),a=R(1,9),x=R(10,99);if(t===0)return {q:`(x² − ${a*a})/(x − ${a}) − x өрнегінің мәні (x = ${x}) = ?`,ans:a,h:'Алдымен қысқарт: x + a.'};const k=R(2,5);return {q:`(${k}x² + ${k*a}x)/x − ${k}x өрнегінің мәні (x = ${x}) = ?`,ans:k*a,h:'Бөлшекті ықшамда.'}}}
];

 f:'a > b ⇔ ∠A > ∠B',
 ex:'AB = 5, BC = 7, AC = 9 ⇒ ең үлкен бұрыш AC-ның қарсысындағы ∠B.',
 br:'Қабырғаларды өсу ретімен орналастыру – сандарды салыстыру, ал бұрыштар да сол ретпен өседі.',
 it:'gtri',
 g:()=>{const s=shuf([R(3,6),R(7,10),R(11,13)]);const nm=['BC','AC','AB'],an=['∠A','∠B','∠C'];const mx=s.indexOf(Math.max(...s));const big=Math.random()<.5;const idx=big?mx:s.indexOf(Math.min(...s));return {q:`△ABC-да BC = ${s[0]}, AC = ${s[1]}, AB = ${s[2]}. Ең ${big?'үлкен':'кіші'} бұрыш:`,...C(an[idx],...an),h:`Ең ${big?'үлкен':'кіші'} қабырғаның қарсысындағы бұрыш.`}}},
{num:13,s:8,t:'Тікбұрышты үшбұрыштар',
 th:'Бір бұрышы тік үшбұрыш тікбұрышты деп аталады. Тік бұрыштың қарсысындағы қабырға – гипотенуза, қалған екеуі – катеттер. Сүйір бұрыштарының қосындысы 90°. 30°-тық бұрыштың қарсысындағы катет гипотенузаның жартысына тең.',
 f:'∠A + ∠B = 90°; &nbsp; ∠A = 30° ⇒ BC = AB/2',
 ex:'Сүйір бұрышы 35° ⇒ екіншісі 55°. 30°-қа қарсы катет 6 см ⇒ гипотенуза 12 см.',
 br:'Гипотенуза мен катет қосындысы 18, ∠A = 30° ⇒ x + 2x = 18, x = 6.',
 it:'gright',
 g:()=>{const t=R(0,2);if(t===0){const a=R(5,85);return {q:`Тікбұрышты үшбұрыштың бір сүйір бұрышы ${ang(a)}. Екіншісі = ? (°)`,ans:90-a,h:'90° − a'}}if(t===1){const c=2*R(2,20);return {q:`Тікбұрышты үшбұрыштың гипотенузасы ${c} см, бір бұрышы 30°. 30°-тық бұрышқа қарсы жатқан катет = ? (см)`,ans:c/2,h:'Гипотенузаның жартысы.'}}const a=R(2,20);return {q:`Тікбұрышты үшбұрышта 30°-тық бұрышқа қарсы катет ${a} см. Гипотенуза = ? (см)`,ans:2*a,h:'Катеттің екі еселенгені.'}}},
/* ---------- III тарау ---------- */
{num:14,s:9,t:'Перпендикуляр және көлбеу',
 th:'Нүктеден түзуге түсірілген перпендикуляр – осы нүктеден түзуге дейінгі ең қысқа кесінді, оның ұзындығы нүктеден түзуге дейінгі қашықтық. Нүктеден түзуге жүргізілген перпендикуляр емес кез келген кесінді – көлбеу, ол перпендикулярдан ұзын.',
 f:'перпендикуляр < көлбеу; &nbsp; перпендикуляр түзулер арасындағы бұрыш = 90°',
 ex:'A нүктесінен a түзуіне перпендикуляр AH = 5 см, көлбеу AB = 7 см: AH < AB.',
 br:'Перпендикуляр мен көлбеу тікбұрышты үшбұрыш құрайды: көлбеу – гипотенуза, сондықтан ол ең ұзын.',
 it:'gperp',
 g:()=>{if(Math.random()<.5){const h=R(2,12),k=R(1,8);return {q:`A нүктесінен түзуге перпендикуляр ${h} см. Сол нүктеден жүргізілген көлбеудің ұзындығы қандай болуы мүмкін?`,...C(`${h+k} см`,`${h} см`,`${Math.max(1,h-k)} см`,`${Math.max(1,h-1)} см`),h:'Көлбеу перпендикулярдан ұзын.'}}const a=R(10,80);return {q:`Екі түзу перпендикуляр. Олар қиылысқанда пайда болған бұрыштардың бірі = ? (°)`,ans:90,h:'Перпендикуляр – 90°.'}}},
{num:15,s:9,t:'Түзулердің параллельдігі',
 th:'Бір жазықтықта жатқан және қиылыспайтын түзулер параллель. Екі параллель түзуді қиюшы қиғанда: айқыш бұрыштар тең, сәйкес бұрыштар тең, тұстас бұрыштардың қосындысы 180°. Керісінше, осы шарттардың бірі орындалса, түзулер параллель.',
 f:'a ∥ b ⇒ айқыш тең, сәйкес тең, тұстас: ∠1 + ∠2 = 180°',
 ex:'Тұстас бұрыштардың бірі 72° ⇒ екіншісі 108°.',
 br:'Координаталық жазықтықта параллель түзулердің бұрыштық коэффициенттері тең: y = 2x + 1 ∥ y = 2x − 3.',
 it:'gpar',
 g:()=>{const t=R(0,2),a=R(20,160);if(t===0)return {q:`a ∥ b, c – қиюшы. Айқыш бұрыштардың бірі ${ang(a)}. Екіншісі = ? (°)`,ans:a,h:'Айқыш бұрыштар тең.'};if(t===1)return {q:`a ∥ b, c – қиюшы. Тұстас бұрыштардың бірі ${ang(a)}. Екіншісі = ? (°)`,ans:180-a,h:'Қосындысы 180°.'};return {q:`a ∥ b, c – қиюшы. Сәйкес бұрыштардың бірі ${ang(a)}. Екіншісі = ? (°)`,ans:a,h:'Сәйкес бұрыштар тең.'}}},
{num:16,s:9,t:'Үшбұрыштың бұрыштарының қосындысы',
 th:'Кез келген үшбұрыштың ішкі бұрыштарының қосындысы 180°. Үшбұрыштың сыртқы бұрышы өзімен сыбайлас емес екі ішкі бұрыштың қосындысына тең.',
 f:'∠A + ∠B + ∠C = 180°; &nbsp; сыртқы ∠ = ∠A + ∠B',
 ex:'∠A = 50°, ∠B = 70° ⇒ ∠C = 60°; C төбесіндегі сыртқы бұрыш 120°.',
 br:'Бұрыштары 2 : 3 : 4 қатынасындағы үшбұрыш: 9x = 180°, x = 20° – теңдеу арқылы шешіледі.',
 it:'gtri',
 g:()=>{const t=R(0,1);if(t===0){const a=R(20,100),b=R(20,150-a);return {q:`△ABC-да ∠A = ${ang(a)}, ∠B = ${ang(b)}. ∠C = ? (°)`,ans:180-a-b,h:'180° − ∠A − ∠B'}}const a=R(20,80),b=R(20,90);return {q:`Үшбұрыштың екі ішкі бұрышы ${ang(a)} және ${ang(b)}. Олармен сыбайлас емес сыртқы бұрыш = ? (°)`,ans:a+b,h:'Сыртқы бұрыш = екі ішкі бұрыштың қосындысы.'}}},
{num:17,s:9,t:'Үшбұрыштың теңсіздігі',
 th:'Үшбұрыштың әр қабырғасы қалған екі қабырғасының қосындысынан кіші және айырымынан үлкен. Үш кесіндіден үшбұрыш құрау үшін ең үлкен кесінді қалған екеуінің қосындысынан кіші болуы керек.',
 f:'|a − b| < c < a + b',
 ex:'3, 4, 6 – үшбұрыш бар (6 < 7). 2, 3, 6 – үшбұрыш жоқ (6 > 5).',
 br:'Үшбұрыш теңсіздігі – қос теңсіздік: |a − b| < c < a + b, оның шешімі – аралық.',
 it:'gineq',
 g:()=>{if(Math.random()<.5){const a=R(2,10),b=R(2,10),ok=Math.random()<.5,c=ok?R(Math.abs(a-b)+1,a+b-1):a+b+R(0,3);return {q:`Қабырғалары ${a}, ${b}, ${c} болатын үшбұрыш бар ма?`,...C(ok?'иә':'жоқ','иә','жоқ'),h:'Ең үлкен қабырға < қалған екеуінің қосындысы.'}}const a=R(2,12),b=R(2,12);return {q:`Үшбұрыштың екі қабырғасы ${a} және ${b}. Үшінші қабырға бүтін сан болса, оның ең үлкен мәні = ?`,ans:a+b-1,h:'c < a + b'}}},
/* ---------- IV тарау ---------- */
{num:18,s:10,t:'Шеңбер және дөңгелек',
 th:'Шеңбер – берілген нүктеден (центрден) бірдей қашықтықта жатқан нүктелер жиыны. Радиус – центрді шеңбердің нүктесімен қосатын кесінді. Хорда – шеңбердің екі нүктесін қосатын кесінді. Диаметр – центр арқылы өтетін хорда, ол ең ұзын хорда. Дөңгелек – шеңбермен шектелген жазықтық бөлігі.',
 f:'d = 2r; &nbsp; хорда ≤ d; &nbsp; C = 2πr ≈ 6,28r',
 ex:'r = 6 см ⇒ d = 12 см; ұзындығы 15 см хорда бұл шеңберде болмайды.',
 br:'Шеңбердің ұзындығы C = 2πr радиусқа тура пропорционал – сызықтық функция.',
 it:'gcirc',
 g:()=>{const t=R(0,2);if(t===0){const r=R(2,25);return {q:`Шеңбердің радиусы ${r} см. Диаметрі = ? (см)`,ans:2*r,h:'d = 2r'}}if(t===1){const d=2*R(2,25);return {q:`Шеңбердің диаметрі ${d} см. Радиусы = ? (см)`,ans:d/2,h:'r = d/2'}}const r=R(3,15);return {q:`Радиусы ${r} см шеңберде хорданың ұзындығы қандай болуы мүмкін?`,...C(`${R(1,2*r)} см`,`${2*r+R(1,5)} см`,`${2*r+R(6,10)} см`,`${3*r} см`),h:'Хорда диаметрден (2r) аспайды.'}}},
{num:19,s:10,t:'Түзу мен шеңбердің өзара орналасуы',
 th:'Центрден түзуге дейінгі қашықтық d, радиус r болсын. d < r – түзу шеңберді екі нүктеде қияды (қиюшы); d = r – бір ортақ нүкте (жанама); d > r – ортақ нүкте жоқ. Жанама жанасу нүктесіне жүргізілген радиусқа перпендикуляр.',
 f:'d < r – 2 нүкте; &nbsp; d = r – жанама; &nbsp; d > r – ортақ нүкте жоқ',
 ex:'r = 5, d = 3 ⇒ қиюшы; d = 5 ⇒ жанама; d = 7 ⇒ ортақ нүкте жоқ.',
 br:'Үш жағдай – сандарды салыстыру: d мен r арасындағы <, =, > таңбалары.',
 it:'glc',
 g:()=>{const r=R(3,12),t=R(0,2),d=t===0?R(0,r-1):t===1?r:r+R(1,6);if(Math.random()<.6)return {q:`Шеңбердің радиусы ${r} см, центрінен түзуге дейінгі қашықтық ${d} см. Түзу мен шеңбердің ортақ нүктелерінің саны = ?`,ans:[2,1,0][t],h:'d мен r-ді салыстыр.'};return {q:`Шеңбердің жанамасы мен жанасу нүктесіне жүргізілген радиус арасындағы бұрыш = ? (°)`,ans:90,h:'Жанама радиусқа перпендикуляр.'}}},
{num:20,s:10,t:'Екі шеңбердің өзара орналасуы',
 th:'Радиустары R және r (R ≥ r), центрлерінің арақашықтығы d. d > R + r – сырттай орналасады (ортақ нүкте жоқ); d = R + r – сырттай жанасады; R − r < d < R + r – екі нүктеде қиылысады; d = R − r – іштей жанасады; d < R − r – бірі екіншісінің ішінде.',
 f:'d = R + r – сырттай жанасу; &nbsp; d = R − r – іштей жанасу',
 ex:'R = 5, r = 3: d = 8 – сырттай жанасады; d = 2 – іштей жанасады; d = 4 – қиылысады.',
 br:'Екі шеңбердің орналасуы d санының R − r және R + r сандарымен салыстырылуына байланысты – сан осіндегі аралықтар.',
 it:'g2c',
 g:()=>{const R0=R(4,12),r=R(1,R0-1),t=R(0,2);if(t===0)return {q:`Радиустары ${R0} см және ${r} см шеңберлер сырттай жанасады. Центрлерінің арақашықтығы = ? (см)`,ans:R0+r,h:'d = R + r'};if(t===1)return {q:`Радиустары ${R0} см және ${r} см шеңберлер іштей жанасады. Центрлерінің арақашықтығы = ? (см)`,ans:R0-r,h:'d = R − r'};const d=R(R0-r+1,R0+r-1);return {q:`R = ${R0}, r = ${r}, d = ${d}. Шеңберлердің ортақ нүктелерінің саны = ?`,ans:2,h:'R − r < d < R + r'}}},
{num:21,s:10,t:'Нүктелердің геометриялық орны',
 th:'Нүктелердің геометриялық орны (НГО) – белгілі бір қасиеті бар барлық нүктелер жиыны. Кесіндінің ұштарынан бірдей қашықтықтағы нүктелердің ГО – оның орта перпендикуляры. Бұрыштың қабырғаларынан бірдей қашықтықтағы нүктелердің ГО – оның биссектрисасы. Берілген нүктеден r қашықтықтағы нүктелердің ГО – шеңбер.',
 f:'MA = MB ⇔ M орта перпендикулярда жатыр',
 ex:'AB-ның орта перпендикулярындағы M нүктесі үшін MA = 7 см ⇒ MB = 7 см.',
 br:'Координаталық жазықтықта A(−a; 0) және B(a; 0) нүктелерінен бірдей қашықтықтағы нүктелер – Oy осі (x = 0).',
 it:'glocus',
 g:()=>{if(Math.random()<.5){const a=R(2,20);return {q:`M нүктесі AB кесіндісінің орта перпендикулярында жатыр, MA = ${a} см. MB = ? (см)`,ans:a,h:'Орта перпендикулярдың нүктелері ұштардан бірдей қашықтықта.'}}const o=pick([['Кесіндінің ұштарынан бірдей қашықтықтағы нүктелер','орта перпендикуляр'],['Бұрыштың қабырғаларынан бірдей қашықтықтағы нүктелер','биссектриса'],['Берілген нүктеден бірдей қашықтықтағы нүктелер','шеңбер']]);return {q:`${o[0]} жиыны – бұл…`,...C(o[1],'орта перпендикуляр','биссектриса','шеңбер','медиана'),h:'НГО анықтамаларын еске түсір.'}}},
{num:22,s:10,t:'Үшбұрышқа сырттай және іштей сызылған шеңберлер',
 th:'Үшбұрыштың барлық төбелері арқылы өтетін шеңбер – сырттай сызылған шеңбер, оның центрі – қабырғалардың орта перпендикулярларының қиылысу нүктесі. Үшбұрыштың барлық қабырғаларын жанайтын шеңбер – іштей сызылған шеңбер, центрі – биссектрисалардың қиылысу нүктесі. Тікбұрышты үшбұрышқа сырттай сызылған шеңбердің центрі – гипотенузаның ортасы.',
 f:'Тікбұрышты үшбұрыш: R = c/2',
 ex:'Тікбұрышты үшбұрыштың гипотенузасы 10 см ⇒ сырттай сызылған шеңбердің радиусы 5 см.',
 br:'Центрді табу – екі түзудің қиылысу нүктесін табу, яғни алгебрадағы теңдеулер жүйесінің геометриялық мағынасы.',
 it:'gcirc',
 g:()=>{if(Math.random()<.5){const c=2*R(2,20);return {q:`Тікбұрышты үшбұрыштың гипотенузасы ${c} см. Сырттай сызылған шеңбердің радиусы = ? (см)`,ans:c/2,h:'R = c/2'}}const o=pick([['Сырттай сызылған шеңбердің центрі','орта перпендикулярлардың қиылысу нүктесі'],['Іштей сызылған шеңбердің центрі','биссектрисалардың қиылысу нүктесі']]);return {q:`${o[0]} – бұл…`,...C(o[1],'орта перпендикулярлардың қиылысу нүктесі','биссектрисалардың қиылысу нүктесі','медианалардың қиылысу нүктесі','биіктіктердің қиылысу нүктесі'),h:'Сырттай – төбелерден бірдей қашық, іштей – қабырғалардан бірдей қашық.'}}},
{num:23,s:10,t:'Салу есептері',
 th:'Салу есептері тек циркуль мен сызғыштың көмегімен шешіледі. Негізгі салулар: берілген бұрышқа тең бұрыш салу, бұрыштың биссектрисасын салу, кесіндіні қақ бөлу (орта перпендикуляр), түзуге перпендикуляр салу, үш қабырғасы бойынша үшбұрыш салу.',
 f:'Құралдар: циркуль + сызғыш (бөліктері жоқ)',
 ex:'Кесіндіні қақ бөлу: ұштарынан бірдей радиуспен екі доға жүргізіп, қиылысу нүктелерін түзумен қосамыз.',
 br:'Үш қабырғасы бойынша үшбұрыш салу мүмкін бе – үшбұрыш теңсіздігін тексеру: c < a + b.',
 it:'gineq',

/* «Дұрыс па?» – кез келген генератордан A деңгейлі тексеру тапсырмасы */
function tfWrap(g){return ()=>{const p=makeProblem(g);const right=Math.random()<.5;let shown;
  if(p.choices){const wr=p.choices.filter(c=>c!==p.ans);shown=right||!wr.length?p.ans:pick(wr)}
  else{shown=right?p.ans:p.ans+pick([1,-1,2,-2,10])}
  const sh=`<span style="color:var(--pri);text-decoration:underline">${p.choices?shown:fnum(shown)}</span>`;
  const q=/=\s*\?\s*$/.test(p.q)?p.q.replace(/=\s*\?\s*$/,'= '+sh):p.q+' → '+sh;
  return {q:`Дұрыс па? &nbsp;${q}`,...C(right?'Иә, дұрыс':'Жоқ, қате',right?'Жоқ, қате':'Иә, дұрыс'),h:`Дұрыс жауап: ${p.choices?p.ans:fnum(p.ans)}`}}}

L.forEach(l=>{l.gA=[l.g,tfWrap(l.g),...(l.g2?[l.g2]:[])];l.gB=XB[l.p]||[l.g];l.gC=XC[l.p]||l.gB});
L.forEach(l=>{const w=g=>()=>{const p=g();if(p&&typeof p==='object')p._l=l;return p};l.g=w(l.g);l.gA=l.gA.map(w);l.gB=l.gB.map(w);l.gC=l.gC.map(w)});

const LS='alg7lvl_v1';
let S=null, teacher=false, backend=null, uid=null;
function blank(name,cls){return {name,cls,xp:0,solved:0,streak:0,best:0,stars:{},boss:{},practice:{},created:Date.now()}}
function loadLocal(){try{return JSON.parse(localStorage.getItem(LS)||'null')}catch(e){return null}}
function saveLocal(){try{localStorage.setItem(LS,JSON.stringify(S))}catch(e){}}
let syncT=null;
function save(){saveLocal();clearTimeout(syncT);syncT=setTimeout(sync,800);renderMe()}
async function sync(){
  if(!backend||!uid||!S) return;
  const path=S.code?`${CROOT(S.code)}/players/${uid}`:`${DB_ROOT}/players/${uid}`;
  try{await backend.ref(path).set({name:S.name,cls:S.cls,sid:S.sid||null,xp:S.xp,lvl:lvlOf(S.xp),solved:S.solved,best:S.best,passed:Object.keys(S.stars).length,stars:S.stars,boss:S.boss,acc:S.acc||{},hist:(S.hist||[]).slice(-30),practice:S.practice||{},t:Date.now()})}catch(e){console.warn('sync',e)}
}
function loadScript(src){return new Promise((res,rej)=>{const s=document.createElement('script');s.src=src;s.onload=res;s.onerror=rej;document.head.appendChild(s)})}
async function initFirebase(){
  try{
    const v='https://www.gstatic.com/firebasejs/10.12.2/';
    await Promise.race([(async()=>{await loadScript(v+'firebase-app-compat.js');await loadScript(v+'firebase-auth-compat.js');await loadScript(v+'firebase-database-compat.js');})(),new Promise((_,r)=>setTimeout(()=>r('timeout'),8000))]);
    if(!firebase.apps.length) firebase.initializeApp(FB);
    await firebase.auth().signInAnonymously();
    uid=firebase.auth().currentUser.uid; backend=firebase.database();
    if(S){ // бұлттағы нәтиже үлкенірек болса, соны аламыз (басқа құрылғыдан кірген жағдай)
      try{const snap=await backend.ref(`${DB_ROOT}/players/${uid}`).get();const c=snap.val();if(c&&c.xp>S.xp){S.xp=c.xp;S.solved=c.solved||S.solved;S.stars=c.stars||S.stars;S.boss=c.boss||S.boss;saveLocal()}}catch(e){}
      sync();
    }
    renderMe();
  }catch(e){console.warn('Firebase қосылмады – жергілікті режим',e);backend=null;renderMe()}

function makeProblem(gen){let p;let n=0;do{p=gen();n++}while((p.ans===null||p.ans===undefined||(typeof p.ans==='number'&&!isFinite(p.ans)))&&n<20);return p}
function parseNum(s){s=String(s).trim().replace(/\s/g,'').replace(',','.').replace('−','-');if(/^-?\d+(\.\d+)?\/-?\d+(\.\d+)?$/.test(s)){const [a,b]=s.split('/').map(Number);return a/b}return s===''?NaN:Number(s)}

   <div class="mut" style="font-size:14px">${nxt?`${nxt.n} деңгейі ашылуына ${nxt.from-c} дұрыс жауап қалды.`:'Барлық деңгейлер ашық – C деңгейінде өзіңді сына!'} Дайын болсаң – «Тексеру» кезеңіне өт.</div>`};

  <div class="grid3">

function bind(ids,fn){ids.forEach(id=>{const el=document.getElementById(id);el.oninput=()=>{document.getElementById(id+'v').textContent=el.value;fn()}});fn()}
const gv=id=>parseFloat(document.getElementById(id).value);
function grid(sc,cx,cy){let s='';for(let x=cx%sc;x<W;x+=sc)s+=`<line x1="${x}" y1="0" x2="${x}" y2="${H}" stroke="#eef1f6"/>`;for(let y=cy%sc;y<H;y+=sc)s+=`<line x1="0" y1="${y}" x2="${W}" y2="${y}" stroke="#eef1f6"/>`;s+=`<line x1="0" y1="${cy}" x2="${W}" y2="${cy}" stroke="#9aa5b8"/><line x1="${cx}" y1="0" x2="${cx}" y2="${H}" stroke="#9aa5b8"/><text x="${W-14}" y="${cy-6}" font-size="12" fill="#626b80">x</text><text x="${cx+6}" y="12" font-size="12" fill="#626b80">y</text>`;for(let i=-12;i<=12;i+=2){if(!i)continue;const x=cx+i*sc;if(x>5&&x<W-5)s+=`<text x="${x-4}" y="${cy+14}" font-size="10" fill="#9aa5b8">${i}</text>`;const y=cy-i*sc;if(y>8&&y<H-5)s+=`<text x="${cx+4}" y="${y+4}" font-size="10" fill="#9aa5b8">${i}</text>`}return s}
function plotF(f,sc,cx,cy,col,w){let d='',pen=false;for(let px=0;px<=W;px+=1.5){const x=(px-cx)/sc,y=f(x),py=cy-y*sc;if(!isFinite(py)||py<-400||py>H+400){pen=false;continue}d+=(pen?'L':'M')+px.toFixed(1)+','+py.toFixed(1);pen=true}return `<path d="${d}" fill="none" stroke="${col}" stroke-width="${w||3}"/>`}

  cards.push({ic:'✏️',t:'Мысал – қадамдап',b:`<div id="exSteps">${exSteps.map((s,i)=>`<div class="exstep ${i?'':'show'}"><span class="num" style="width:30px;height:30px;font-size:14px">${i+1}</span><div>${s}</div></div>`).join('')}</div>${exSteps.length>1?`<button class="btn ghost" id="exNext" style="margin-top:10px">Келесі қадам ↓</button>`:''}`});
  cards.push({ic:l.subj==='geo'?'🔢':'📐',t:l.subj==='geo'?'Алгебрамен байланыс':'Геометриямен байланыс',b:`<div class="bridge" style="font-size:19px">${l.br}</div>`});
  if(l.qs)cards.push({ic:'❓',t:'Өзіңді тексер',b:l.qs.map(q=>`<div class="qa" style="font-size:18px" onclick="this.classList.toggle('open')"><b>${q[0]}</b> <span class="mut" style="font-size:12px">(басып тексер)</span><div class="an">✔ ${q[1]}</div></div>`).join('')});
  cards.push({ic:'🚀',t:'Дайынсың!',b:`<div class="prob" style="font-size:22px">${sample.q}</div>${fig?`<div class="figbox">${figFor(l,sample,true)}</div>`:''}<p style="font-size:19px">Жауабы: <b style="color:var(--ok)">${sample.choices?sample.ans:fnum(sample.ans)}</b>. Енді өзің шығарып көр – әр дұрыс жауап XP береді!</p>`,last:true});
  let i=0;
  const draw=()=>{const c=cards[i];
    st.innerHTML=`<div class="row" style="justify-content:space-between"><div class="dots" style="margin:0;flex:1">${cards.map((_,j)=>`<i class="${j<i?'ok':j===i?'cur':''}" style="flex:1;width:auto;cursor:pointer" data-j="${j}"></i>`).join('')}</div><button class="btn ghost" style="margin-left:12px;padding:7px 12px;font-size:13px" onclick="thMode='text';renderLesson()">📄 Толық мәтін</button></div>
     <div class="tcard"><div class="tc-h"><span style="font-size:34px">${c.ic}</span><h2 style="margin:0">${c.t}</h2><span class="mut" style="margin-left:auto">${i+1}/${cards.length}</span></div>${c.b}</div>
     <div class="row" style="justify-content:space-between;margin-top:12px"><button class="btn ghost" id="cPrev" ${i===0?'disabled':''}>← Артқа</button>${c.last?`<button class="btn ok" onclick="step++;renderLesson()">Келесі кезең →</button>`:`<button class="btn" id="cNext">Әрі қарай →</button>`}</div>`;
    st.querySelectorAll('[data-j]').forEach(e=>e.onclick=()=>{i=+e.dataset.j;draw()});
    const pv=st.querySelector('#cPrev');if(pv)pv.onclick=()=>{i--;draw()};const nx=st.querySelector('#cNext');if(nx)nx.onclick=()=>{i++;draw()};
    if(c.inter&&l.it)INTER[l.it](document.getElementById('cardInter'));
    const en=st.querySelector('#exNext');if(en)en.onclick=()=>{const h=st.querySelector('.exstep:not(.show)');if(h)h.classList.add('show');if(!st.querySelector('.exstep:not(.show)'))en.remove()};
  };
  draw();
}

/* =====================================================================
   ЖАҢА ТАПСЫРМА ТҮРЛЕРІ: сәйкестендіру, ретімен қою, суретті таңдау,
   координаталық торға нүкте белгілеу, транспортирмен бұрыш салу

function triShape(A,B,o={}){ // нақты бұрыштары бар үшбұрыш суреті
  const ra=A*Math.PI/180,rb=B*Math.PI/180,ac=Math.sin(rb)/Math.sin(ra+rb);let Q=[[0,0],[1,0],[ac*Math.cos(ra),ac*Math.sin(ra)]];
  const xs=Q.map(p=>p[0]),mn=Math.min(...xs),mx=Math.max(...xs),my=Math.max(...Q.map(p=>p[1]));const sc=Math.min(300/(mx-mn),190/my),ox=(FW-(mx-mn)*sc)/2-mn*sc,oy=FH-30;Q=Q.map(p=>[ox+p[0]*sc,oy-p[1]*sc]);
  let s=`<polygon points="${Q.map(p=>p.join(',')).join(' ')}" fill="${o.fill||'#fdefe3'}" stroke="${o.col||'#e47a2e'}" stroke-width="3" stroke-linejoin="round"/>`;
  if(o.lab)['A','B','C'].forEach((n,i)=>s+=T_(Q[i][0]+(i===1?10:i===0?-12:0),Q[i][1]+(i===2?-8:16),n,'#1c2236',14));
  if(o.sides){const m=(i,j)=>[(Q[i][0]+Q[j][0])/2,(Q[i][1]+Q[j][1])/2];const [a,b,c]=o.sides;const pa=m(1,2),pb=m(0,2),pc=m(0,1);s+=T_(pa[0]+16,pa[1],a,'#3a5bdc',14)+T_(pb[0]-16,pb[1],b,'#3a5bdc',14)+T_(pc[0],pc[1]+18,c,'#3a5bdc',14)}
  return fsvg(s);
}
function angleShape(d){const cx=80,cy=200,L0=230,a=d*Math.PI/180;return fsvg(angArc(cx,cy,0,a,50,'#3a5bdc')+LN(cx,cy,cx+L0,cy)+LN(cx,cy,cx+L0*Math.cos(a),cy-L0*Math.sin(a))+DOT(cx,cy)+(d===90?`<rect x="${cx}" y="${cy-18}" width="18" height="18" fill="none" stroke="#1c2236" stroke-width="2"/>`:''))}
function fracBar(n,d,col){const W0=320,x0=30,y0=90,h=60;let s='';for(let i=0;i<d;i++)s+=`<rect x="${x0+i*W0/d}" y="${y0}" width="${W0/d}" height="${h}" fill="${i<n?col:'#fff'}" stroke="#1c2236" stroke-width="2"/>`;return fsvg(s+T_(FW/2,55,`${n}/${d}`,'#1c2236',30))}
/* ---------- генераторлар ---------- */
const TY={};
const distinctVals=(n,f)=>{const out=[],seen=new Set();let k=0;while(out.length<n&&k<400){const x=f();const key=String(x[1]);if(!seen.has(key)){seen.add(key);out.push(x)}k++}return out};
TY.powMatch=()=>{const pr=distinctVals(4,()=>{const a=pick([2,3,4,5,-2,-3,10]),n=R(0,a===10?4:3);return [`${par(a)}${sup(n)}`,a**n]});return {type:'match',q:'Дәрежелер мен олардың мәндерін сәйкестендір',pairs:pr.map(([a,b])=>[a,String(b).replace('-','−')]),h:'Әр дәрежені есептеп шық.'}};

TY.stdOrder=()=>{const it=distinctVals(4,()=>{const m=R(11,99)/10,e=R(-3,5);return [`${String(m).replace('.',',')} · 10${sup(e)}`,m*10**e]});return {type:'order',q:'Сандарды өсу ретімен орналастыр',items:it.map(([h,v])=>({h,v})),h:'Алдымен реттерін (10-ның дәрежесін) салыстыр.'}};

TY.fsuMatch=()=>{const pr=distinctVals(4,()=>{const a=R(1,9),t=R(0,2);return t===0?[`(x + ${a})²`,P([[1,2],[2*a,1],[a*a,0]])]:t===1?[`(x − ${a})²`,P([[1,2],[-2*a,1],[a*a,0]])]:[`(x − ${a})(x + ${a})`,P([[1,2],[-a*a,0]])]});return {type:'match',q:'Өрнекті қысқаша көбейту формуласы бойынша жазылған түрімен сәйкестендір',pairs:pr,h:'(a ± b)² = a² ± 2ab + b², (a − b)(a + b) = a² − b²'}};
TY.fracMatch=()=>{const pr=distinctVals(4,()=>{const a=R(1,9);return pick([[`(x² − ${a*a})/(x − ${a})`,`x + ${a}`],[`(x² + ${a}x)/x`,`x + ${a}`],[`(${a}x + ${a*a})/${a}`,`x + ${a}`]])}).filter((v,i,arr)=>arr.findIndex(z=>z[1]===v[1])===i);while(pr.length<3){const a=R(10,20);pr.push([`(x² − ${a*a})/(x + ${a})`,`x − ${a}`])}return {type:'match',q:'Бөлшекті қысқартылған түрімен сәйкестендір',pairs:pr,h:'Алымын көбейткіштерге жікте.'}};
TY.fracCompare=()=>{let a,b,c,d;do{b=R(3,9);a=R(1,b-1);d=R(3,9);c=R(1,d-1)}while(a*d===b*c);const big=a/b>c/d?0:1;return {type:'pickfig',q:`Қайсысы үлкен? &nbsp;<b>${a}/${b}</b> немесе <b>${c}/${d}</b>`,figs:[fracBar(a,b,'#3a5bdc'),fracBar(c,d,'#e47a2e')],ans:big,ansText:big?`${c}/${d}`:`${a}/${b}`,h:`Ортақ бөлімге келтір: ${a*d}/${b*d} және ${b*c}/${b*d}`}};
TY.linePick=()=>{const k=RN(-3,3),b=R(-4,4);const opts=shuf([[k,b],[-k,b],[k,-b===b?b+2:-b],[k===1?2:1,b]]).filter((v,i,arr)=>arr.findIndex(z=>z[0]===v[0]&&z[1]===v[1])===i);const ans=opts.findIndex(v=>v[0]===k&&v[1]===b);return {type:'pickfig',q:`Қай сурет <b>y = ${P([[k,1],[b,0]])}</b> функциясының графигі?`,figs:opts.map(([kk,bb])=>figGraph([x=>kk*x+bb],[],{sc:20})),ans,ansText:`${'ABCD'[ans]} сурет`,h:'Oy осін (0; b) нүктесінде қияды; k > 0 болса өседі.'}};

function analyse(st){ // st: оқушы деректері (S немесе Firebase жазбасы)
  const acc=st.acc||{},stars=st.stars||{};
  const rows=L.map(l=>{const a=acc[l.p]||{r:0,w:0},n=a.r+a.w;return {l,n,pct:n?Math.round(a.r/n*100):null,star:stars[l.p]}}).filter(x=>x.n>0||x.star!=null);
  const weak=rows.filter(x=>(x.n>=3&&x.pct<60)||x.star===1).sort((a,b)=>(a.pct??100)-(b.pct??100));
  const strong=rows.filter(x=>x.n>=5&&x.pct>=85&&x.star>=2);
  const tests=(st.hist||[]).filter(h=>h.k==='t'||h.k==='b');
  const avgTest=tests.length?Math.round(tests.reduce((a,h)=>a+h.s/h.n,0)/tests.length*100):null;
  const tot=rows.reduce((a,x)=>a+x.n,0),totR=rows.reduce((a,x)=>a+(acc[x.l.p]?acc[x.l.p].r:0),0);
  return {rows,weak,strong,tests,avgTest,accPct:tot?Math.round(totR/tot*100):null,tot};
}
const markOf=pct=>pct==null?'—':pct>=85?5:pct>=65?4:pct>=40?3:2;

  cv.onpointermove=e=>{if(!down)return;ctx.globalCompositeOperation=er?'destination-out':'source-over';ctx.strokeStyle=col;ctx.lineWidth=er?w*6:w;ctx.lineCap='round';ctx.lineJoin='round';ctx.beginPath();ctx.moveTo(...last);ctx.lineTo(e.clientX,e.clientY);ctx.stroke();last=[e.clientX,e.clientY]};
  cv.onpointerup=()=>{down=false};
  const sync=()=>{bar.querySelectorAll('[data-c]').forEach(b=>b.style.outlineColor=b.dataset.c===col&&!er?'#1c2236':'#ccd');bar.querySelector('#inker').style.background=er?'var(--pri2)':'';bar.querySelector('#inkgr').style.background=grid?'var(--pri2)':''};
  bar.querySelectorAll('[data-c]').forEach(b=>b.onclick=()=>{col=b.dataset.c;er=false;sync()});
  bar.querySelector('#inkw').onchange=e=>w=+e.target.value;w=5;
  bar.querySelector('#inker').onclick=()=>{er=!er;sync()};
  bar.querySelector('#inkgr').onclick=()=>{grid=!grid;bg();sync()};
  bar.querySelector('#inkcl').onclick=()=>ctx.clearRect(0,0,cv.width,cv.height);
  bar.querySelector('#inkx').onclick=closeInk;sync();
}
function closeInk(){['inkcv','inkbar'].forEach(id=>{const e=document.getElementById(id);if(e)e.remove()})}

function openPres(i){presI=i;let o=document.getElementById('pres');if(!o){o=document.createElement('div');o.id='pres';document.body.append(o)}drawPres();document.onkeydown=e=>{if(!document.getElementById('pres'))return;if(e.key==='ArrowRight')presGo(1);if(e.key==='ArrowLeft')presGo(-1);if(e.key==='Escape')closePres()};try{o.requestFullscreen&&o.requestFullscreen()}catch(e){}}
function presGo(d){presI=Math.max(0,Math.min(PRES.length-1,presI+d));drawPres()}
function closePres(){const o=document.getElementById('pres');if(o)o.remove();document.onkeydown=null;try{document.fullscreenElement&&document.exitFullscreen()}catch(e){}}
function drawPres(){const P=PRES[presI],o=document.getElementById('pres');o.style.background=`radial-gradient(1000px 600px at 80% 0%,rgba(255,255,255,.12),transparent),${P.bg}`;
 o.innerHTML=`<div class="pr-in" key="${presI}"><div class="pr-h">${P.h}</div>${P.s?`<div class="pr-s">${P.s}</div>`:''}<div class="pr-ic ${P.tiles?'tiles':''}">${P.ic.map((x,j)=>`<div class="pr-i" style="animation-delay:${j*.12}s"><span>${x}</span>${P.cap?`<b>${P.cap[j]}</b>`:''}</div>`).join('')}</div>${P.go?`<button class="btn gold" style="font-size:20px;padding:12px 26px" onclick="closePres();${P.go[0]}">${P.go[1]} →</button>`:''}${P.f?`<div class="pr-f">${P.f}</div>`:''}</div>
 <div class="pr-nav"><button onclick="presGo(-1)">‹</button><span>${presI+1} / ${PRES.length}</span><button onclick="presGo(1)">›</button><button onclick="closePres()">✕</button></div>`}
/* ---------- навигация ---------- */
let tArea='board';
function setNav(){const n=document.getElementById('nav');if(!n)return;const items=teacher?[['home','🏠'],['t-board','🖥 Интерактивті тақта'],['t-cab','👨‍🏫 Кабинет'],['t-docs','📁 Құжаттар']]:[['home','🏠'],['map','🎮 Ойын'],['growth','🏅 Деңгейім'],['rating','🏆 Рейтинг']];
 const cur=view==='teacher'?'t-'+tArea:(teacher&&view==='ktp')?'t-docs':view;n.innerHTML=items.map(([k,t])=>`<button data-v="${k}" class="${cur===k?'on':''}">${t}</button>`).join('');
 n.querySelectorAll('button').forEach(b=>b.onclick=()=>{const v=b.dataset.v;if(v==='home')return renderHome();if(v.startsWith('t-')){tArea=v.slice(2);tTab={board:'lesson',cab:'mon',docs:'ktp'}[tArea];return show('teacher')}show(v)})}
